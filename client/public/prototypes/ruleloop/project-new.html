<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>RuleLoop · 新建项目</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div id="topbar"></div>
<div style="display:flex;">
  <div id="sidebar"></div>
  <div style="flex:1;padding:24px 32px;">
    <a href="projects.html" style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--rl-text-3);text-decoration:none;">
      <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>返回项目库
    </a>
    <div style="font-size:20px;font-weight:600;margin-top:12px;">新建项目</div>
    <div style="font-size:13px;color:var(--rl-text-3);margin-top:4px;">3 步完成项目初始化</div>

    <!-- 进度条 -->
    <div style="display:flex;align-items:center;margin:32px 0;max-width:680px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="width:28px;height:28px;border-radius:50%;background:var(--rl-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;">1</div>
        <span style="font-size:13px;font-weight:500;color:var(--rl-primary);">基础信息</span>
      </div>
      <div style="flex:1;height:2px;background:var(--rl-border);margin:0 12px;"></div>
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="width:28px;height:28px;border-radius:50%;background:#fff;border:1.5px solid var(--rl-border);color:var(--rl-text-3);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;">2</div>
        <span style="font-size:13px;color:var(--rl-text-3);">配置规则文档</span>
      </div>
      <div style="flex:1;height:2px;background:var(--rl-border);margin:0 12px;"></div>
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="width:28px;height:28px;border-radius:50%;background:#fff;border:1.5px solid var(--rl-border);color:var(--rl-text-3);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;">3</div>
        <span style="font-size:13px;color:var(--rl-text-3);">邀请成员</span>
      </div>
    </div>

    <div class="rl-card" style="max-width:680px;">
      <div style="margin-bottom:18px;">
        <label style="font-size:13px;color:var(--rl-text-2);font-weight:500;">项目名称 <span style="color:var(--rl-danger)">*</span></label>
        <input class="rl-input" style="margin-top:6px;" placeholder="如：视频基础质量分级" />
      </div>
      <div style="margin-bottom:18px;">
        <label style="font-size:13px;color:var(--rl-text-2);font-weight:500;">项目简介</label>
        <textarea class="rl-textarea" style="margin-top:6px;min-height:80px;" placeholder="一句话描述这个项目的标准范畴…"></textarea>
      </div>
      <div style="margin-bottom:18px;">
        <label style="font-size:13px;color:var(--rl-text-2);font-weight:500;">项目图标</label>
        <div style="margin-top:8px;display:flex;gap:10px;">
          <div style="width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#1E5EFF,#5B8DFF);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;border:2px solid var(--rl-primary);">视</div>
          <div style="width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#00B42A,#33D14C);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;cursor:pointer;">字</div>
          <div style="width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#FF7D00,#FFB84D);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;cursor:pointer;">镜</div>
          <div style="width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#A855F7,#C084FC);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;cursor:pointer;">译</div>
          <input class="rl-input" style="width:120px;" placeholder="自定义首字" />
        </div>
      </div>
      <div style="margin-bottom:18px;">
        <label style="font-size:13px;color:var(--rl-text-2);font-weight:500;">项目类型</label>
        <div style="margin-top:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">
          <div style="padding:14px;border:2px solid var(--rl-primary);border-radius:8px;background:var(--rl-primary-bg);cursor:pointer;">
            <div style="font-size:13px;font-weight:500;color:var(--rl-primary);">视频质量类</div>
            <div style="font-size:11px;color:var(--rl-text-3);margin-top:4px;">分维度评分 / 多档位</div>
          </div>
          <div style="padding:14px;border:1.5px solid var(--rl-border);border-radius:8px;cursor:pointer;">
            <div style="font-size:13px;font-weight:500;">文本定义类</div>
            <div style="font-size:11px;color:var(--rl-text-3);margin-top:4px;">caption / 标签定义</div>
          </div>
          <div style="padding:14px;border:1.5px solid var(--rl-border);border-radius:8px;cursor:pointer;">
            <div style="font-size:13px;font-weight:500;">自定义</div>
            <div style="font-size:11px;color:var(--rl-text-3);margin-top:4px;">自由配置规则结构</div>
          </div>
        </div>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:24px;padding-top:20px;border-top:1px solid var(--rl-border);">
        <a href="projects.html" class="rl-btn rl-btn-secondary">取消</a>
        <a href="project-overview.html" class="rl-btn rl-btn-primary">下一步：配置规则文档 →</a>
      </div>
    </div>
  </div>
</div>
<script src="assets/common.js"></script>
<script>document.getElementById('topbar').innerHTML = renderTopbar([
    {label:'项目库',href:'projects.html'},
    {label:'新建项目'}
  ]);
  document.getElementById('sidebar').innerHTML = renderGlobalSidebar('projects');
</script>
</body>
</html>
